[project]
name = "RAG"
version = "0.1.0"
description = "Retrieval-Augmented Generation"
requires-python = ">=3.10"
dependencies = [
    "pydantic",
    "fire",
    "tqdm",
    "transformers",
    "torch"
    ]

[dependency-groups]
dev = [
    "flake8>=7.4.1",
    "mypy>=2.3.1",
]

[tool.mypy]
exclude = [
    "data/",
]
